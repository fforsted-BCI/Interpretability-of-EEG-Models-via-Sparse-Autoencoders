[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "sae-eeg-frozen-pipeline"
version = "0.1.0"
description = "Session-T discovery / frozen Session-E SAE feature replication for EEG embeddings"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pandas>=2.0", "torch>=2.1", "joblib>=1.3", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7.0"]
real = ["moabb>=1.1", "mne>=1.7"]
[project.scripts]
sae-eeg = "sae_eeg.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
